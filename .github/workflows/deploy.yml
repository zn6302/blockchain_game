name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 一次只跑一個部署,不然兩個 deploy 互相蓋來蓋去。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 先在 CI 裡跑一次 lint + build。image 裡面雖然會再 build 一次,
      # 但這裡壞掉可以在幾十秒內失敗,不用等整個 docker build 跑完。
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
