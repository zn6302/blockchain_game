<meta charset="utf-8">
<title>區塊鏈大戰爭</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap">
<style>
:root{
  --ink:#080A08; --panel:#111511; --panel-2:#161B15; --line:#242C23;
  --lime:#A3E635; --lime-dim:#6E9E22; --lime-soft:rgba(163,230,53,.12);
  --txt:#E8EFE3; --muted:#8A9583; --faint:#5B6558;
  --up:#A3E635; --down:#F2555A; --stable:#4FD1C5; --mid:#F5A524; --p4:#E2557A;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --mono:"Chakra Petch",ui-monospace,monospace;
  --sans:"Noto Sans TC","Chakra Petch",system-ui,sans-serif;
  --pixel:"Press Start 2P","Noto Sans TC",monospace;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--txt);font-family:var(--sans);margin:0;overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.wrap{max-width:1640px;margin:0 auto;padding:18px 22px 26px}

/* ---------- top HUD ---------- */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--lime);display:grid;place-items:center;
  color:#0B1004;font-weight:900;font-size:17px;font-family:var(--mono)}
.brand h1{font-size:14px;margin:0;letter-spacing:.5px;font-weight:900}
.brand span{display:block;font-size:10px;color:var(--faint);letter-spacing:2.4px;font-family:var(--mono)}
.clock{text-align:right}
.clock .t{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;letter-spacing:1px}
.clock .l{font-size:10px;color:var(--faint);letter-spacing:2.6px;font-family:var(--mono)}
.clock.warn .t{color:var(--down)}

.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:0}
.leadchip{display:none;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  color:var(--muted);white-space:nowrap}
.leadchip b{font-size:11px}
.leadchip i{width:7px;height:7px;border-radius:2px;display:inline-block}
.pl{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;position:relative;overflow:hidden}
.pl.me{border-color:rgba(163,230,53,.45)}
.pl.dead{opacity:.34}
.pl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl .nm{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:3px;flex:none}
.pshort{display:none;font-family:var(--mono)}
.pl .val{font-family:var(--mono);font-size:13px;font-weight:700}
.bar{height:4px;border-radius:2px;background:#0C0F0B;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .35s ease}
.pl .sub{display:none}                                  /* 現金／場上／兵數看下方的操作列就好 */

/* ---------- stage (map-first) ---------- */
.wrap{max-width:none;height:100vh;display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px}
.stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 92% at 50% 42%,#101711 0%,#090C08 72%)}
svg.map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.map.drag{cursor:grabbing}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoomctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:rgba(9,13,9,.9);color:var(--txt);font-size:15px;font-weight:700;line-height:1}
.zoomctl button:hover{border-color:var(--lime);color:var(--lime)}
.zoomctl button.on{border-color:var(--lime);color:var(--lime)}
.intro{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:4;
  font-family:var(--pixel);font-size:9px;color:#0B1004;background:var(--lime);
  border-radius:20px;padding:8px 16px;opacity:0;transition:opacity .35s}
.intro.on{opacity:1}

.ovl{position:absolute;top:12px;width:250px;background:rgba(9,13,9,.86);border:1px solid var(--line);
  border-radius:14px;backdrop-filter:blur(8px);display:flex;flex-direction:column;overflow:hidden;
  max-height:calc(100% - 152px);box-shadow:0 8px 26px rgba(0,0,0,.45)}
.market{left:12px;width:208px}
.troops{right:12px;width:246px;max-height:calc(100% - 160px)}
.troops h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.troops h2 b{font-family:var(--mono);font-size:11px;color:var(--lime);letter-spacing:.4px}
.tlist{overflow-y:auto;padding:0 9px 9px;display:flex;flex-direction:column;gap:5px}
.trow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 7px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;transition:border-color .12s}
.trow:hover{border-color:var(--lime)}
.trow.on{border-color:#F2F7EE;background:rgba(242,247,238,.07)}
.trow.fight{border-color:rgba(242,85,90,.75)}
.trow.cash{border-color:rgba(163,230,53,.85);animation:rowp 1.1s ease-in-out infinite}
@keyframes rowp{0%,100%{background:var(--panel-2)}50%{background:rgba(163,230,53,.13)}}
.tg{width:24px;height:24px;flex:none;border-radius:6px;display:grid;place-items:center;
  border:1px solid var(--line);background:#0C120C}
.tg img{height:20px;width:auto;image-rendering:pixelated}
.tmid{flex:1;min-width:0;display:block}
.tl{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tn{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn em{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-left:4px}
.tpl{font-family:var(--mono);font-size:10px;font-weight:700;flex:none}
.thp{display:block;height:3px;border-radius:2px;background:#0C0F0B;margin:4px 0 3px;overflow:hidden}
.thp i{display:block;height:100%;border-radius:2px}
.tst{display:block;font-size:9px;color:var(--faint);font-family:var(--mono);letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tset{flex:none;align-self:stretch;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:4px 6px;line-height:1}
.tset:hover{border-color:var(--lime);color:var(--lime)}
.tempty{padding:4px 4px 10px;font-size:10px;color:var(--faint);line-height:1.6}
.ovl h2{font-size:9px;letter-spacing:2px;color:var(--faint);margin:0;padding:9px 11px 5px;
  font-family:var(--mono);font-weight:600;text-transform:uppercase}
.market h2{display:none}
#coins{overflow-y:auto}
.legend{position:absolute;left:14px;bottom:14px;display:flex;gap:14px;
  font-size:9.5px;color:var(--muted);font-family:var(--mono);background:rgba(9,13,9,.7);
  border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}

/* ---------- dock (bottom of the map) ---------- */
.dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:stretch;gap:12px;
  background:rgba(7,10,7,.9);border:1px solid var(--line);border-radius:16px;padding:10px 12px;
  backdrop-filter:blur(8px);box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:calc(100% - 24px)}
.dockcol{display:flex;flex-direction:column;gap:7px}
.dockcol .lab{font-size:9.5px;font-family:var(--mono);letter-spacing:1.6px;color:var(--faint);text-transform:uppercase}
.dockcol .lab b{font-family:var(--pixel);font-size:7.5px;letter-spacing:0;color:var(--lime);
  border:1px solid rgba(163,230,53,.45);border-radius:5px;padding:2px 6px;margin-left:4px}
.sep{width:1px;background:var(--line);margin:2px 0}
.units{display:flex;gap:8px}
.u{width:88px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 6px 7px;
  position:relative;overflow:hidden;text-align:center;transition:border-color .15s,transform .08s}
.u:hover:not(.off){border-color:var(--lime);transform:translateY(-1px)}
.u.off{opacity:.38;cursor:not-allowed}
.u .uimg{display:block;height:44px;width:auto;margin:2px auto 1px;image-rendering:pixelated}
.u .n{font-size:11px;font-weight:700;margin-top:1px;white-space:nowrap}
.u .n .px{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--lime);margin-left:2px}
.u .c{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--txt);margin-top:5px;letter-spacing:.2px}
.u.poor .c{color:var(--down)}
.u .k{position:absolute;top:4px;left:5px;font-family:var(--mono);font-size:8px;color:var(--faint);
  border:1px solid var(--line);border-radius:4px;padding:0 3px}
.u .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(4,6,4,.72);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--lime)}
.u.fire{border-color:var(--lime);background:rgba(163,230,53,.22);transform:translateY(-3px)}
.u .cstrip{position:absolute;left:0;right:0;top:0;height:3px}

.u .k{top:6px}
.u.charging::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--lime);
  width:0;animation:chg .7s linear forwards}
@keyframes chg{to{width:100%}}
.u.charging{border-color:var(--lime)}
.u.rug{opacity:.32}
.u.rug::before{content:"歸零";position:absolute;inset:auto 0 34%;text-align:center;
  font-family:var(--pixel);font-size:8px;color:#F2555A;letter-spacing:1px}

/* svg text */
.unitglyph{font-family:var(--sans);font-size:6.5px;font-weight:900;text-anchor:middle}
.plmark{font-family:var(--mono);font-size:7px;font-weight:700;text-anchor:middle}
.plbig{font-family:var(--mono);font-size:8.5px;font-weight:700;text-anchor:middle}
.plg.good{animation:plp .9s ease-in-out infinite}
.plg.bad{animation:plp 1.4s ease-in-out infinite}
@keyframes plp{0%,100%{opacity:1}50%{opacity:.5}}
.basetag{font-family:var(--pixel);font-size:8px;letter-spacing:.5px}
.hex{cursor:pointer}
.hex.sel .top{stroke:#F2F7EE;stroke-width:3}
#scene g[data-uid]{cursor:pointer}
#scene image{image-rendering:pixelated}
.dmgtxt{font-family:var(--mono);font-size:11px;font-weight:700;text-anchor:middle}
.cointxt{font-family:var(--mono);font-size:10px;font-weight:700}
.minepulse{animation:mp 1s ease-out infinite}
@keyframes mp{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(1.5)}}
.hotzone{animation:hz 1.1s ease-in-out infinite}
@keyframes hz{0%,100%{opacity:.28}50%{opacity:.9}}
.acts{display:flex;gap:7px}
.a{width:104px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:7px 9px;
  text-align:left;display:flex;flex-direction:column;gap:1px;transition:border-color .15s}
.a:hover:not(.off){border-color:var(--lime)}
.a.off{opacity:.38;cursor:not-allowed}
.a .t{font-size:11px;font-weight:700}
.a .d{font-size:9px;color:var(--faint);line-height:1.3}
.a .p{font-family:var(--mono);font-size:9.5px;color:var(--lime-dim);margin-top:1px}
/* 手機用的部隊列（桌機用右上面板，這條不顯示） */
.tstrip{display:none}
.helper{position:absolute;left:0;right:0;bottom:calc(100% + 9px);display:none;
  background:rgba(9,13,9,.96);border:1px solid rgba(245,165,36,.55);border-radius:12px;
  padding:9px 14px;font-size:12px;line-height:1.55;color:var(--muted);
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
.helper.on{display:block}
.helper b{color:var(--txt)}
.helper .hb{height:3px;border-radius:2px;background:#0C0F0B;margin-top:7px;overflow:hidden}
.helper .hb i{display:block;height:100%;background:var(--mid)}
.tchip{flex:none;display:flex;align-items:center;gap:5px;padding:3px 6px 3px 3px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;min-width:0}
.tchip img{height:22px;width:auto;image-rendering:pixelated;flex:none}
.tchip .cw{display:flex;flex-direction:column;gap:2px;min-width:34px}
.tchip .cp{font-family:var(--mono);font-size:9.5px;font-weight:700;line-height:1}
.tchip .cb{height:3px;border-radius:2px;background:#0C0F0B;overflow:hidden}
.tchip .cb i{display:block;height:100%}
.tchip.on{border-color:#F2F7EE;background:rgba(242,247,238,.08)}
.tchip.fight{border-color:rgba(242,85,90,.8)}
.tchip.cash{border-color:rgba(163,230,53,.9);animation:rowp 1.1s ease-in-out infinite}
.tempty2{font-size:9.5px;color:var(--faint);padding:4px 2px}
.cashcol{min-width:172px}
.cash{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--lime);line-height:1;margin-top:1px}
.ticker{display:flex;flex-direction:column;gap:2px;margin-top:7px}
.tk{display:grid;grid-template-columns:34px auto auto 1fr;gap:6px;align-items:baseline;
  font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.tk .tkh{text-align:right;font-weight:700}
.tk b{font-weight:700}
.tk .tkp{color:var(--txt)}
.tk.hot{animation:tkhot 1s ease-in-out infinite}
@keyframes tkhot{0%,100%{opacity:1}50%{opacity:.45}}
.evtbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;display:none;
  min-width:min(420px,84%);max-width:min(560px,90%);background:rgba(9,13,9,.95);
  border:1px solid var(--line);border-radius:12px;padding:8px 13px 9px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.evtbar.on{display:block}
.evtbar .ehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12px;line-height:1.35}
.evtbar .eco{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap}
.evtbar .esub{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.evtbar .ebar{height:3px;border-radius:2px;background:#0C0F0B;margin-top:7px;overflow:hidden}
.evtbar .ebar i{display:block;height:100%}
.u.evt{animation:evtp 1s ease-in-out infinite}
@keyframes evtp{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 2px currentColor}}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%) translateY(-6px);z-index:6;
  max-width:min(560px,86%);background:rgba(9,13,9,.94);border:1px solid var(--line);border-radius:12px;
  padding:8px 14px;font-size:11.5px;line-height:1.45;color:var(--txt);opacity:0;pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{border-color:rgba(245,165,36,.55)}
.toast.bad{border-color:rgba(242,85,90,.55)}
.target{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;
  font-size:10px;font-family:var(--mono);color:var(--muted);background:rgba(7,10,7,.9);
  border:1px solid var(--line);border-radius:16px;padding:4px 12px}
.target b{color:var(--lime)}

@media (max-width:1240px){
  .ovl{width:230px}
  .u{width:68px}.a{width:92px}
}
/* ---------- mobile ---------- */
@media (max-width:900px){
  .wrap{padding:6px 6px 8px;gap:6px}
  .hud{grid-template-columns:minmax(0,1fr);gap:6px;padding:6px 8px;border-radius:12px}
  .brand{display:none}
  .clock{display:block;text-align:center}
  .clock .t{font-size:20px}.clock .l{font-size:7px;letter-spacing:1.2px}
  .players{gap:4px}
  .pl{padding:4px 6px;border-radius:9px;min-width:0}
  .pl .row{gap:4px}
  .pl .nm{font-size:9px;gap:3px;max-width:38px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zoomctl .zbtn{display:none}
  .pl .val{font-size:10.5px}
  .pl .bar{height:4px;margin-top:5px}
  .pl .sub{display:none}
  .stage{border-radius:12px}
  .troops{display:none}
  .legend{display:none}
  .zoomctl{top:8px;right:8px;bottom:auto;flex-direction:row;gap:5px}
  .zoomctl button{width:30px;height:30px;font-size:13px}
  .zoomctl .zbtn{display:none}                       /* 手機用雙指縮放就好 */
  .evtbar{top:8px;min-width:0;max-width:calc(100% - 156px);left:8px;transform:none;padding:6px 10px 7px}
  .evtbar .ehead{font-size:11px}.evtbar .eco{font-size:11px}.evtbar .esub{font-size:9.5px}
  .toast{top:74px;font-size:10.5px;padding:6px 11px;max-width:calc(100% - 156px);left:8px;transform:none;
    margin-right:156px}
  .toast.on{transform:none}
  .dock{left:6px;right:6px;bottom:6px;transform:none;max-width:none;flex-direction:column;
    gap:6px;padding:7px 8px;border-radius:13px}
  .dock .target{display:none}
  .tstrip{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px}
  .sep{display:none}
  .dockcol{gap:5px}
  .dockcol .lab{display:none}
  .cashcol{min-width:0;flex-direction:row;align-items:center;gap:10px}
  .tk .tkh{display:none}
  .cash{font-size:17px;margin:0}
  .ticker{flex-direction:row;gap:9px;margin:0;flex:1;overflow-x:auto}
  .tk{display:flex;gap:4px;font-size:9px}
  .units,.acts{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .u{width:60px;flex:none;padding:5px 3px 4px}
  .u .uimg{height:30px}
  .u .n{font-size:9px}.u .c{font-size:11px;margin-top:2px}
  .u .pw{margin-top:2px;gap:1.5px}.u .pw i{width:6px;height:2.5px}.u .pw span{font-size:7px}
  .u .k{font-size:7px;top:3px;left:3px}.u .cc{font-size:6.5px;top:3px;right:3px}
  .u .chg{display:none}
  .u .n .px{font-size:8px}
  .a{width:auto;flex:1;min-width:76px;padding:5px 7px;gap:0}
  .a .t{font-size:9.5px}.a .d{display:none}.a .p{font-size:9px}
  .panel{padding:18px 15px 15px;border-radius:16px}
  .panel h3{font-size:18px}.panel p.lead{font-size:11.5px}
  .steps{grid-template-columns:1fr;gap:6px;margin:10px 0 12px}
  .st{padding:8px 10px;display:flex;align-items:baseline;gap:8px}
  .st b{margin:0}.st span{font-size:12.5px}.st i{margin:0 0 0 4px}
  .classes{grid-template-columns:1fr;gap:7px}
  .cls{padding:10px 12px}.cls p{min-height:0;font-size:11px;margin-bottom:7px}
  .cls .stat{display:none}
}
@media (max-width:620px){
  .pname{display:none}
  .pshort{display:inline}
  .pl .nm{max-width:none}
  .pl{padding:4px 5px}
  .players{gap:3px}
  .u{width:56px}.u .g{font-size:14px}.u .n{font-size:9px}
  .a{width:86px}
}
/* ---------- 手機橫式：畫面很矮，介面要壓成一條 ---------- */
@media (orientation:landscape) and (max-height:560px){
  .wrap{padding:5px 6px 6px;gap:5px}
  .hud{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:4px 8px;border-radius:10px}
  .brand{display:none}
  .players{gap:4px}
  .pl{padding:3px 6px;border-radius:8px}
  .pl .nm{font-size:8.5px;max-width:none}.pl .val{font-size:10px}
  .pl .bar{height:3px;margin-top:3px}.pl .sub{display:none}
  .clock{display:block;text-align:right}
  .clock .t{font-size:19px}.clock .l{display:none}
  .stage{border-radius:10px}
  .troops{display:none}

const BASES={"0,-4":0, "4,-4":1, "0,4":2, "-4,4":3};
const RING_MIX=[
  ["exchange"],
  ["mine_NOX","mine_KIBB","vault","mine_NOX","mine_KIBB","forest"],
  ["mine_KIBB","forest","mine_NOX","waste","vault","forest","mine_KIBB","waste"],

  ["mountain","forest","waste","mountain","waste","forest","mountain","waste","forest","waste","mountain","waste"]
];
const ZONES=(()=>{
  const out=[];
  for(let r=-4;r<=4;r++)for(let q=-4;q<=4;q++){
    if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))>4) continue;
    const key=q+","+r;
    if(key in BASES){ out.push([q,r,"base",BASES[key]]); continue; }
    const d=(Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2;
    const pool=RING_MIX[d];
    const h=Math.abs(q*7919+r*104729+d*31)%pool.length;
    out.push([q,r,pool[h]]);
  }
  return out;
})();
const ZINFO={

const ZELEV=ZONES.map((z,i)=>{                   // 每格再加一點高低起伏
  const rg=rngFor(i*613+29), t=z[2];
  const j=(t==="mountain")?rg.f(-6,14):(t==="base"||t==="exchange")?0:
          (t==="vault")?rg.f(-4,2):rg.f(-6,7);
  return ZINFO[t].elev+Math.round(j);
});
const ZSCALE=ZONES.map((z,i)=>{                   // 每格的大小略有變化（只放大，才不會露出縫）
  const rg=rngFor(i*911+53), t=z[2];
  if(t==="exchange") return 1.16;                 // 交易所這塊特別大
  if(t==="base") return 1.10;
  return 1+rg.f(0,0.09);
});
function elevOf(q,r){const i=ZMAP[q+","+r];return i==null?0:ZELEV[i];}
function hexXY(q,r){
  return {x:OX+HEXR*Math.sqrt(3)*(q+r/2), y:OY+HEXR*1.5*KY*r-elevOf(q,r)};
}
function isoPts(cx,cy,f){
  f=f||1;const p=[];
  for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90);
    p.push([cx+HEXR*f*Math.cos(a), cy+HEXR*f*Math.sin(a)*KY]);}
  return p;
}
const PS=(p)=>p.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
const PG=(p,fill,extra)=>`<polygon points="${PS(p)}" fill="${fill}" ${extra||""}/>`;
const EL=(x,y,rx,ry,f,o)=>`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${f}"${o?` opacity="${o}"`:""}/>`;
const RC=(x,y,w,h,f,r)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${r||0}" fill="${f}"/>`;
function rngFor(seed){let s=(seed*2654435761)%4294967291+7;
  return {f:(a,b)=>{s=(s*1103515245+12345)%2147483648;return a+(b-a)*(s%1000)/1000;},
          i:(a,b)=>{s=(s*1103515245+12345)%2147483648;return a+s%(b-a+1);}};}

/* ---------------- props ---------------- */
function pShadowTri(x,y,h,w){       // long cast shadow for a conical object
  return PG([[x-w*0.42,y],[x+w*0.42,y],[x+h*SH_DX+w*0.2,y+h*SH_DY]],P.shadow)
       + EL(x,y,w*0.44,w*0.17,P.shadow);
}
function pPine(x,y,h,w){
  const sh=pShadowTri(x,y,h,w);
  let b=RC(x-w*0.055,y-h*0.16,w*0.11,h*0.2,"#6A4C2E");
  for(let t=0;t<3;t++){
    const bw=w*(1-0.2*t), by=y-h*0.12-t*h*0.24, ap=by-h*0.34;
    b+=PG([[x,ap],[x-bw/2,by],[x,by+bw*0.14]],P.pineL);
    b+=PG([[x,ap],[x+bw/2,by],[x,by+bw*0.14]],P.pineD);
    b+=PG([[x,ap],[x-bw*0.17,ap+h*0.13],[x+bw*0.10,ap+h*0.12]],P.treeM);
  }
  return [sh,b,y];
}
function pBroad(x,y,r){
  const sh=EL(x+r*0.62,y+r*0.2,r*1.15,r*0.44,P.shadow);
  let b=RC(x-r*0.1,y-r*0.9,r*0.2,r*0.95,"#6A4C2E");
  b+=EL(x,y-r*0.95,r*1.0,r*0.72,P.treeD);
  b+=EL(x-r*0.28,y-r*1.22,r*0.72,r*0.54,P.treeM);
  b+=EL(x-r*0.42,y-r*1.36,r*0.42,r*0.3,P.treeL);
  b+=EL(x+r*0.55,y-r*0.78,r*0.42,r*0.3,P.treeX);
  return [sh,b,y];
}
function pBush(x,y,r){
  return [EL(x+r*0.55,y+r*0.2,r*1.1,r*0.42,P.shadow),
    EL(x,y-r*0.3,r,r*0.6,P.treeD)+EL(x-r*0.28,y-r*0.5,r*0.6,r*0.38,P.treeM)
   +EL(x-r*0.4,y-r*0.62,r*0.3,r*0.2,P.treeL), y];
}
function pRock(x,y,h,w,rg,snow){
  const top=[x+rg.f(-w*0.08,w*0.14),y-h], bl=[x-w*0.6,y+h*0.02], br=[x+w*0.62,y+h*0.02],
        mid=[x+w*0.05,y+h*0.08], rL=[x-w*0.5,y-h*rg.f(0.2,0.36)], rR=[x+w*0.55,y-h*rg.f(0.18,0.34)],
        nk=[x+w*0.02,y-h*rg.f(0.5,0.62)];
  const sh=PG([bl,br,[br[0]+h*SH_DX*0.95,br[1]+h*SH_DY*0.95],[top[0]+h*SH_DX,top[1]+h*SH_DY+h]],P.shadow)
          +EL(x+w*0.12,y+h*0.04,w*0.62,w*0.22,P.shadow);
  let b=PG([top,rL,bl,mid],P.rockL)+PG([top,mid,br,rR],P.rockD)
       +PG([top,nk,mid,rL],P.rockM)
       +PG([bl,mid,[mid[0],mid[1]+h*0.07],[bl[0]+w*0.12,bl[1]+h*0.05]],P.rockS)
       +PG([mid,br,[br[0]-w*0.1,br[1]+h*0.06]],P.rockX);
  if(snow){                                   // 雪蓋沿著山的稜線往下，不會跑出輪廓
    const f=0.36, lerp=(a,b2,t)=>[a[0]+(b2[0]-a[0])*t, a[1]+(b2[1]-a[1])*t];
    const sL=lerp(top,rL,f), sM=lerp(top,mid,f*1.25), sR=lerp(top,rR,f*0.92);
    const zL=lerp(top,rL,f*0.72), zR=lerp(top,rR,f*0.66);
    b+=PG([top,zL,sL,sM],"#FFFFFF")
     +PG([top,sM,sR,zR],"#E4EAE6");
  }
  return [sh,b,y];

/* ============================ 狀態 ============================ */
const S={
  t:180, running:false, cls:null, sel:null, selU:null,
  units:[], uid:0, players:[], over:false,
  evtT:10, warn:null, pending:null, trend:null, hint:"", fx:[], hot:"", logs:[], avgW:900, baseInc:5,
  stats:{buys:0,invested:0,sells:0,realized:0,best:null,worst:null,holdSum:0,holdN:0,
         deaths:0,deathLoss:0,rugLoss:0,rugged:false,allin:0,allinPL:null,spend:{NOX:0,CATN:0,MEOW:0}}
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const money=(v)=>"$"+Math.round(v).toLocaleString();

/* ---- 部位：每個場上單位就是一筆持倉 ---- */
function posValue(u){return u.qty*COINS[u.coin].price;}          // 部位現值
function unitWorth(u){return posValue(u)*(u.hp/u.hpMax);}        // 受傷會折損
function posTotal(p){let w=0;S.units.forEach(u=>{if(u.alive&&u.p===p.i)w+=unitWorth(u);});return w;}
function netWorth(p){return p.cash+posTotal(p);}
function atZone(u){const z=ZONES[u.z],{x,y}=hexXY(z[0],z[1]);return Math.hypot(x-u.x,y-u.y)<46;}
function hasUnitOn(pi,type){return S.units.some(u=>u.alive&&u.p===pi&&ZONES[u.z][2]===type&&atZone(u));}
function holdBonus(u){                                            // 長期持有者：抱越久越賺
  const cls=CLASSES[S.players[u.p].cls];
  return cls.loyal?Math.min(0.36,Math.floor(u.age/6)*0.04):0;
}
function powerMul(u){                                             // 幣價 → 戰力
  const c=COINS[u.coin];
  if(c.price<=0.002) return 0.4;                                  // 歸零剩四成戰力
  const cls=CLASSES[S.players[u.p].cls];
  return clamp(c.price/u.entry,cls.lo,cls.hi);
}
function sizeMul(u){                                              // 戰力 → 體型（放大變化才看得出來）
  return clamp(1+(powerMul(u)-1)*1.35,0.6,1.75);
}
function feeOf(p){return CLASSES[p.cls].fee*(hasUnitOn(p.i,"exchange")?0.5:1);}
function cdMulOf(p){return CLASSES[p.cls].cdMul*(hasUnitOn(p.i,"mountain")?0.75:1);}
function packOf(k){return k==="titan"?1:PACK;}          // 一張卡出幾隻
function unitCost(k,p){                                  // 單隻：幣量 × 當下幣價 × 身份倍率
  const u=UNITS[k];
  return Math.max(1,u.qty*COINS[u.coin].price*CLASSES[p.cls].costMul);
}
function costOf(k,p){return Math.max(1,Math.round(unitCost(k,p)*packOf(k)));}
function qtyOf(k,p){return Math.round(UNITS[k].qty*CLASSES[p.cls].costMul*packOf(k));}
function settleValue(u){                                          // 撤回能拿回多少
  return posValue(u)*(u.hp/u.hpMax)*(1+holdBonus(u))*(1-feeOf(S.players[u.p]));
}
/* ---- 反雪球：落後補助、領先者遞減、礦區容量 ---- */
const BASE_INCOME=5;              // 基地每秒基礎收入
// 同一礦區疊越多礦工，後面的產出遞減（沒有人數上限，想派多少就派多少）
const rankF=(i)=>1/(1+0.25*i);    // 第 1／2／3／4 名 = 100%／80%／67%／57%
const DEATH_BACK=0.35;            // 陣亡時拿回的殘值比例（讓玩家能一直出兵）
function avgWorth(){
  const alive=S.players.filter(p=>p.alive);
  if(!alive.length) return 1;
  return Math.max(80,alive.reduce((a,p)=>a+netWorth(p),0)/alive.length);
}
function worthRatio(p){return netWorth(p)/(S.avgW||avgWorth());}
function catchUpMul(p){return clamp(2.2-1.5*worthRatio(p),1,2);}      // 落後 → 收入最多 2×
function leadMineMul(p){return clamp(1.6-0.6*worthRatio(p),0.55,1.25);} // 領先 → 產能最低 55%
function minersIn(pi,z){return S.units.filter(u=>u.alive&&u.p===pi&&u.z===z&&UNITS[u.k].role==="mine").length;}
function mineRank(u){
  const same=S.units.filter(o=>o.alive&&o.p===u.p&&o.z===u.z&&UNITS[o.k].role==="mine")
                    .sort((a,b)=>a.id-b.id);
  return same.findIndex(o=>o.id===u.id);
}
function mineRate(u){
  const zi=ZINFO[ZONES[u.z][2]]; if(!zi.coin||UNITS[u.k].role!=="mine") return 0;
  const p=S.players[u.p], cls=CLASSES[p.cls];
  return zi.yield*UNITS[u.k].rate*cls.mine*(1+holdBonus(u))*leadMineMul(p)*rankF(mineRank(u))
         *powerMul(u);
}
function priceImpact(coin,usd){                                   // 大額進出推動幣價（滑價）
  const c=COINS[coin]; if(c.price<=0.002) return;
  c.price=Math.max(0.002,c.price*(1+clamp(usd/24000,-0.05,0.05)));
}

function initPlayers(clsKey){

/* ============================ 音效 ============================ */
const SFX={on:false,ac:null,last:{}};
function sfxInit(){
  if(SFX.ac) return;
  try{SFX.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(_){}
}
function sfx(kind,vol){
  if(!SFX.on||!SFX.ac) return;
  const now=SFX.ac.currentTime, gap={shot:0.07,hit:0.07,kill:0.12,buy:0.05,sell:0.05,warn:0.4,coin:0.16}[kind]||0.08;
  if(SFX.last[kind]&&now-SFX.last[kind]<gap) return;
  SFX.last[kind]=now;
  const ac=SFX.ac, g=ac.createGain(), o=ac.createOscillator();
  let f0=440,f1=440,dur=0.08,type="square",v=(vol||1)*0.06;
  if(kind==="shot"){f0=680;f1=420;dur=0.05;type="square";v*=0.5;}
  if(kind==="hit"){f0=240;f1=120;dur=0.07;type="sawtooth";}
  if(kind==="kill"){f0=180;f1=48;dur=0.26;type="sawtooth";v*=1.5;}
  if(kind==="buy"){f0=420;f1=760;dur=0.10;type="triangle";}
  if(kind==="sell"){f0=760;f1=380;dur=0.14;type="triangle";}
  if(kind==="warn"){f0=300;f1=300;dur=0.30;type="sine";v*=1.3;}
  if(kind==="coin"){f0=980;f1=1460;dur=0.06;type="triangle";v*=0.6;}
  o.type=type; o.frequency.setValueAtTime(f0,now);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),now+dur);
  g.gain.setValueAtTime(v,now);
  g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g); g.connect(ac.destination); o.start(now); o.stop(now+dur+0.02);
}

/* ============================ 畫面：戰場 ============================ */
function tileSVG(idx){
  const [q,r,type,owner]=ZONES[idx], z=ZINFO[type], {x,y}=hexXY(q,r);
  const rg=rngFor(idx*97+13);
  const water=(type==="vault");
  const elev=ZELEV[idx];
  const F=ZSCALE[idx];
  const p=isoPts(x,y,F), dep=DEPTH+elev+(water?12:0)+(type==="exchange"?34:0);  // 交易所是一塊高台
  const sides=water?P.wSide:(type.startsWith("mine")?P.soil:
              (type==="mountain"?["#7C8A8C","#68767A","#556269","#434E56"]:P.gSide));
  let s=`<g class="hex" data-z="${idx}">`;
  [[1,2,3],[2,3,0],[3,4,1],[4,5,2]].forEach(([i1,i2,sh])=>{
    s+=PG([p[i1],p[i2],[p[i2][0],p[i2][1]+dep],[p[i1][0],p[i1][1]+dep]],sides[sh]);
  });
  if(type==="mountain"){                                  // 岩層橫帶（順著側面走，不會像四條黑柱）
    [[1,2],[2,3],[3,4],[4,5]].forEach(([i1,i2])=>{
      [[0.34,0.42],[0.66,0.72]].forEach(([t0,t1])=>{
        s+=PG([[p[i1][0],p[i1][1]+dep*t0],[p[i2][0],p[i2][1]+dep*t0],
               [p[i2][0],p[i2][1]+dep*t1],[p[i1][0],p[i1][1]+dep*t1]],"#000000",'opacity=".13"');
      });
    });
  }
  // ---- top face
  const inner=isoPts(x,y,0.9*F);
  if(water){
    s+=PG(p,P.sand,`class="top" stroke="${P.wDark}" stroke-width="1.6" stroke-linejoin="round"`);
    s+=PG(isoPts(x,y+1,0.93*F),P.wTop);
    s+=PG(isoPts(x,y+3,0.72*F),P.wIn);
    s+=PG(isoPts(x,y+5,0.44*F),P.wDeep);
    for(let i=0;i<3;i++)
      s+=RC(x+rg.f(-26,4),y+rg.f(-16,18),rg.f(16,34),3.2,P.wLight,1.6);
  }else{
    const GTOPS=["#2A5C4E","#2F6555","#356F5C","#3A7864","#40836D","#478C74"];
    const gi=type==="exchange"?5:clamp(Math.round((elev+9)/7)+rg.i(-1,1),0,5);
    const base=type==="waste"?P.gWaste:GTOPS[gi];
    s+=PG(p,base,`class="top" stroke="${P.seam}" stroke-width="1.4" stroke-linejoin="round"`);
    s+=PG([p[5],p[0],p[1],inner[1],inner[0],inner[5]],P.gBevel,'opacity=".5"');
  }
  if(type.startsWith("mine")){                            // 階梯礦坑
    [[0.78,3,P.soilTop],[0.6,9,P.soil[0]],[0.44,15,P.soil[1]],[0.28,20,P.soil[2]],[0.14,24,P.soil[3]]]
      .forEach(([f,dy,c])=>{s+=PG(isoPts(x+2,y+dy,f),c);});
  }
  let sh="", bd="";
  const props=[];                                  // 前景物件（會擋住角色）
  const add=(pr)=>{sh+=pr[0];props.push({y:pr[2]!=null?pr[2]:y,s:pr[1]});};
  // 草地細節
  if(!water&&!type.startsWith("mine")){
    for(let i=0;i<rg.i(3,6);i++){
      const a2=rg.f(0,6.283), rad=rg.f(10,HEXR*0.68);
      const gx=x+Math.cos(a2)*rad, gy=y+Math.sin(a2)*rad*KY;
      s+=EL(gx,gy,rg.f(5,10),rg.f(2,3.4),type==="waste"?"#2B5747":"#40806A",.9);
    }
  }
  if(type==="base"){
    s+=PG(isoPts(x,y,0.93*F),"none",`stroke="${PLAYER_COLORS[owner]}" stroke-width="${owner===0?3.4:2.2}"
        stroke-linejoin="round" opacity="${owner===0?.95:.7}"`);
    if(owner===0) s+=PG(isoPts(x,y,0.8*F),PLAYER_COLORS[0],'opacity=".08"');
    add(pHouse(x+4,y+12,15,14,PLAYER_COLORS[owner],"#1E2A1C",true));
    add(pHouse(x-24,y+20,10,9,PLAYER_COLORS[owner],"#1E2A1C",false));
    add(pFlag(x+26,y+4,30,PLAYER_COLORS[owner]));
    add(pBush(x+30,y+20,7));
    add(pPine(x-32,y+2,30,15));
  }else if(type==="exchange"){
    add(pExchange(x,y+12,21));
    add(pBush(x-46,y-2,7));add(pBush(x+48,y-4,6));      // 草叢挪到左右後方，別擋到貓
    add(pFlag(x-34,y-12,24,"#A3E635"));
  }else if(type==="mine_NOX"||type==="mine_KIBB"){
    const nox=type==="mine_NOX", col=nox?"#F5A524":"#4FD1C5";   // 迷因幣＝橘、貓薄荷＝青
    s+=EL(x+2,y+8,HEXR*0.55,HEXR*0.55*KY,col,.12);          // 地面色圈
    s+=`<ellipse cx="${(x+2).toFixed(1)}" cy="${(y+8).toFixed(1)}" rx="${(HEXR*0.55).toFixed(1)}"
        ry="${(HEXR*0.55*KY).toFixed(1)}" fill="none" stroke="${col}" stroke-width="2"
        stroke-dasharray="${nox?"7 6":"3 5"}" opacity=".55"/>`;
    bd+=pOre(x+2,y+4,col,rg);
    add(pFrame(x-26,y+2,34));
    add(pSign(x+22,y+15,17,col,nox?"MEME":"CATN"));
    add(pCart(x+8,y+20,8,col));
    for(let i=0;i<3;i++) add(pBoulder(x+rg.f(-40,40),y+rg.f(-14,-2),rg.f(5,8)));
  }else if(type==="vault"){
    add(pPier(x-30,y+14,16));
    add(pVault(x+4,y-2,17));
    add(pSign(x+26,y+12,15,"#A3E635","NOX"));
  }else if(type==="mountain"){
    add(pRock(x+6,y+10,rg.f(52,64),rg.f(48,60),rg,true));
    add(pRock(x-24,y+16,rg.f(26,36),rg.f(28,36),rg,rg.i(0,2)===0));
    for(let i=0;i<rg.i(2,3);i++) add(pBoulder(x+rg.f(-38,38),y+rg.f(4,18),rg.f(5,9)));
    add(pPine(x+30,y+18,24,12));
  }else if(type==="forest"){
    const n=rg.i(5,7), spots=[];
    for(let k=0;k<30&&spots.length<n;k++){
      const a2=rg.f(0,6.283), rad=rg.f(0,HEXR*0.6);
      const fx=x+Math.cos(a2)*rad, fy=y+Math.sin(a2)*rad*KY;
      if(spots.some(t=>Math.abs(t[0]-fx)<17&&Math.abs(t[1]-fy)<9)) continue;
      spots.push([fx,fy]);
    }
    spots.sort((m,n2)=>m[1]-n2[1]).forEach(([fx,fy],k)=>{
      if(k%3===2) add(pBroad(fx,fy,rg.f(9,13)));
      else add(pPine(fx,fy,rg.f(28,42),rg.f(14,19)));
    });
  }else{                                                   // waste
    for(let i=0;i<rg.i(2,4);i++) add(pBoulder(x+rg.f(-40,40),y+rg.f(-10,16),rg.f(5,10)));
    if(rg.i(0,2)===0) add(pPine(x+rg.f(-22,22),y+rg.f(2,14),rg.f(22,30),12));
    if(rg.i(0,2)===0) add(pBush(x+rg.f(-30,30),y+rg.f(0,16),rg.f(6,9)));
  }
  return {g:s+sh+bd+"</g>", props};
}
function renderMap(){
  const map=$("#map");
  const order=ZONES.map((z,i)=>i).sort((i1,i2)=>{
    const A=ZONES[i1],B=ZONES[i2];
    return (A[1]-B[1])||(A[0]-B[0]);
  });
  const front=order.filter(i=>ZONES[i][2]==="exchange");        // 交易所的地塊最後畫，蓋在別塊上面
  const rest=order.filter(i=>ZONES[i][2]!=="exchange");
  const tiles=rest.concat(front).map(tileSVG);
  let s=tiles.map(t=>t.g).join("");
  PROPS.length=0;
  tiles.forEach(t=>t.props.forEach(pr=>PROPS.push(pr)));
  PROPS.sort((a,b)=>a.y-b.y);
  s+='<g id="labelLayer" style="pointer-events:none">';
  ZONES.forEach(([q,r,type,owner],idx)=>{
    if(type!=="base") return;
    const {x,y}=hexXY(q,r), ly=y-HEXR*KY-14;

              fill="none" stroke="${PLAYER_COLORS[0]}" stroke-width="2.4" opacity=".85"/>`;
      }
      s+=`<g class="youbob"><path d="M${x.toFixed(1)},${(y-HEXR*KY-24).toFixed(1)}

  // 站在樹／山／房子上方的角色會被前景擋住。
  BANDS.min=Math.floor(PROPS.length?PROPS[0].y:0)-BAND;
  BANDS.n=Math.ceil(((PROPS.length?PROPS[PROPS.length-1].y:0)-BANDS.min)/BAND)+2;
  const buckets=Array.from({length:BANDS.n},()=>"");

    s+=`<g class="pb" style="pointer-events:none">${buckets[i]}</g><g class="ub" id="ub${i}"></g>`;

  map.innerHTML=s;

}
const PROPS=[];                                   // 所有前景物件
const BAND=15;                                    // 每條場景帶的高度（px）
const BANDS={min:0,n:1,el:[],cache:[]};
function bandOf(y){return clamp(Math.floor((y-BANDS.min)/BAND),0,BANDS.n-1);}

/* ---------------- camera (zoom / pan) ---------------- */
const VBW=940, VBH=640;
const CAM={x:VBW/2,y:VBH/2,z:1,dragged:false};
function applyCam(){
  const map=$("#map"); if(!map) return;
  const w=VBW/CAM.z, h=VBH/CAM.z;
  map.setAttribute("viewBox",`${(CAM.x-w/2).toFixed(1)} ${(CAM.y-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
}
const MAPB=(()=>{                                   // 地圖的實際世界範圍
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ZONES.forEach(z=>{const {x,y}=hexXY(z[0],z[1]);
    x0=Math.min(x0,x-HEXR);x1=Math.max(x1,x+HEXR);
    y0=Math.min(y0,y-HEXR*0.9);y1=Math.max(y1,y+HEXR*0.9+DEPTH);});
  return {x0,y0,x1,y1};
})();
function viewSize(){                                // slice 之後實際看得到的世界範圍
  const map=$("#map"); if(!map) return {w:VBW/CAM.z,h:VBH/CAM.z};
  const r=map.getBoundingClientRect(), vw=VBW/CAM.z, vh=VBH/CAM.z;
  const sc=Math.max(r.width/vw, r.height/vh);
  return {w:r.width/sc, h:r.height/sc};
}
function uiPad(sel,extra){                       // 被介面蓋住的高度，換算成世界單位
  const map=$("#map"), el=document.querySelector(sel);
  if(!map||!el) return 0;
  const r=map.getBoundingClientRect(); if(!r.height) return 0;
  return (el.getBoundingClientRect().height+(extra||0))*(viewSize().h/r.height);
}
function clampCam(){
  CAM.z=Math.max(0.6,Math.min(2.8,CAM.z));
  const v=viewSize(), pad=40;
  const cx=(MAPB.x0+MAPB.x1)/2, cy=(MAPB.y0+MAPB.y1)/2;
  const lx0=MAPB.x0+v.w/2-pad, lx1=MAPB.x1-v.w/2+pad;
  const ly0=MAPB.y0+v.h/2-pad-uiPad(".toast",16);      // 上面被提示條蓋住
  const ly1=MAPB.y1-v.h/2+pad+uiPad(".dock",24);       // 下面被操作列蓋住
  CAM.x = lx0>lx1 ? cx : Math.max(lx0,Math.min(lx1,CAM.x));
  CAM.y = ly0>ly1 ? cy : Math.max(ly0,Math.min(ly1,CAM.y));
}
function fitView(){return {x:(MAPB.x0+MAPB.x1)/2,y:(MAPB.y0+MAPB.y1)/2,z:1};}
function homeView(){
  const b=ZONES.find(z=>z[2]==="base"&&z[3]===0);
  const {x,y}=hexXY(b[0],b[1]);
  return {x:x+40,y:y+18,z:window.innerWidth<900?1.6:1.75};
}
function animateTo(t,ms){
  const s0={x:CAM.x,y:CAM.y,z:CAM.z}, t0=performance.now();
  const red=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(red||ms<=0){Object.assign(CAM,t);clampCam();applyCam();return;}
  (function step(now){
    const k=Math.min(1,(now-t0)/ms), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    CAM.x=s0.x+(t.x-s0.x)*e; CAM.y=s0.y+(t.y-s0.y)*e; CAM.z=s0.z+(t.z-s0.z)*e;
    clampCam(); applyCam();
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
function svgScale(){
  const map=$("#map"), r=map.getBoundingClientRect();
  return Math.max(r.width/(VBW/CAM.z), r.height/(VBH/CAM.z));
}
function setupCamera(){
  const map=$("#map");
  const pts=new Map(); let lastDist=0, moved=0, sx=0, sy=0;
  map.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){moved=0;sx=e.clientX;sy=e.clientY;CAM.dragged=false;map.classList.add("drag");
      try{map.setPointerCapture(e.pointerId);}catch(_){}}
    if(pts.size===2){const a=[...pts.values()];lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
  });
  map.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      const a=[...pts.values()], d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(lastDist){CAM.z*=d/lastDist;clampCam();applyCam();}
      lastDist=d; CAM.dragged=true; return;
    }
    const k=1/svgScale();
    CAM.x-=(e.clientX-prev.x)*k; CAM.y-=(e.clientY-prev.y)*k;
    moved+=Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y);
    if(moved>7) CAM.dragged=true;
    clampCam(); applyCam();
  });
  const up=e=>{pts.delete(e.pointerId);lastDist=0;map.classList.remove("drag");
    setTimeout(()=>{CAM.dragged=false;},60);};
  map.addEventListener("pointerup",up); map.addEventListener("pointercancel",up);
  map.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=map.getBoundingClientRect(), sc=svgScale();
    const wx=CAM.x+(e.clientX-r.left-r.width/2)/sc, wy=CAM.y+(e.clientY-r.top-r.height/2)/sc;
    const before=CAM.z; CAM.z*=e.deltaY<0?1.055:0.948; clampCam();
    const f=1-before/CAM.z;
    CAM.x+=(wx-CAM.x)*f; CAM.y+=(wy-CAM.y)*f;
    clampCam(); applyCam();
  },{passive:false});
  $("#zin").onclick=()=>animateTo({x:CAM.x,y:CAM.y,z:CAM.z*1.16},200);
  $("#zout").onclick=()=>animateTo({x:CAM.x,y:CAM.y,z:CAM.z/1.16},200);
  $("#zhome").onclick=()=>animateTo(homeView(),420);
  addEventListener("resize",()=>{clampCam();applyCam();});
}
/* ---------------- pixel tooltip ---------------- */
const tipCache=new Map();
function pixelText(text,weight,size,family,color,track){
  track=track||0;
  const c=document.createElement("canvas"), m=c.getContext("2d");
  const font=`${weight} ${size}px ${family}`;
  m.font=font;
  const chars=[...text];
  const cw=chars.map(ch=>Math.ceil(m.measureText(ch).width));
  const w=Math.max(1,cw.reduce((a,b)=>a+b,0)+track*Math.max(0,chars.length-1)+2);
  const h=Math.ceil(size*1.45)+2;
  c.width=w; c.height=h;
  const g=c.getContext("2d");
  g.font=font; g.textBaseline="top"; g.fillStyle=color;
  let cx=1; chars.forEach((ch,i)=>{g.fillText(ch,cx,1);cx+=cw[i]+track;});
  const im=g.getImageData(0,0,w,h), d=im.data;
  for(let i=0;i<d.length;i+=4) d[i+3]=d[i+3]>92?255:0;    // 去除消鋸齒 → 硬邊像素
  g.putImageData(im,0,0);
  return {url:c.toDataURL(),w,h};
}
function showTip(idx){
  const map=$("#map"), tip=map.querySelector("#tip");
  const [q,r,type,owner]=ZONES[idx], z=ZINFO[type], {x,y}=hexXY(q,r);
  let t=tipCache.get(idx);
  if(!t){
    const name = type==="base" ? `${z.t} P${owner+1}` : z.t;
    const sub  = z.coin ? `+$${z.yield}/s ${z.coin}` : z.s;
    const col  = z.coin ? COINS[z.coin].hex : (type==="base"?PLAYER_COLORS[owner]:"#9FB79A");
    t={ n:pixelText(name,900,15,'"Noto Sans TC",sans-serif',"#F2F7EE",3),
        s:pixelText(sub,400,8,'"Press Start 2P",monospace',col,1),
        edge:type==="base"?PLAYER_COLORS[owner]:"#A3E635" };
    tipCache.set(idx,t);
  }
  const K=Math.max(0.3, 0.62/CAM.z), padX=8*K, padY=7*K, gap=8*K;
  const nw=t.n.w*K, nh=t.n.h*K, sw=t.s.w*K, sh=t.s.h*K;
  const w=Math.max(nw,sw)+padX*2, h=nh+gap+sh+padY*2;
  const X=-w/2, Y=-h;
  const set=(id,a)=>{const e=map.querySelector(id);for(const k in a)e.setAttribute(k,a[k]);};
  set("#tipShadow",{x:X+5,y:Y+5,width:w,height:h});
  set("#tipEdge",{x:X,y:Y,width:w,height:h,fill:t.edge});
  set("#tipBg",{x:X+3,y:Y+3,width:w-6,height:h-6});
  set("#tipName",{href:t.n.url,x:-nw/2,y:Y+padY,width:nw,height:nh});
  set("#tipSub",{href:t.s.url,x:-sw/2,y:Y+padY+nh+gap,width:sw,height:sh});
  tip.setAttribute("transform",`translate(${x.toFixed(1)},${(y-HEXR*KY-8).toFixed(1)})`);
  tip.style.display="";
}
function updateTarget(){
  const el=$("#target"); if(!el) return;
  const u=S.units.find(x=>x.id===S.selU&&x.alive);
  if(u){
    const r=COINS[u.coin].price/u.entry, pl=(r-1)*100;
    el.innerHTML=`已選部隊：<b>${UNITS[u.k].n}</b>（現在值 ${money(posValue(u))} 的 ${u.coin}
      <span style="color:${pl>=0?"var(--up)":"var(--down)"}">${pl>=0?"▲":"▼"}${Math.abs(pl).toFixed(1)}%</span>）
      — 按「結算」撤回換成 Cash`;
    return;
  }
  if(S.sel==null){el.innerHTML='目標區域：<b>未選擇</b> — 點地圖選格子；點自己的部隊可以結算';return;}
  const z=ZINFO[ZONES[S.sel][2]];
  el.innerHTML=`目標：<b>${z.t}</b>${z.coin?` · 產出 $${z.yield}/s`:""} — 部隊從基地走過去，只有傘兵能空降`;
}

const NS="http://www.w3.org/2000/svg";
const UNODES=new Map();                 // 單位 → DOM 節點（重用，不每幀重建字串）
function makeNode(u){
  const d=UNITS[u.k], ch=COINS[u.coin], c=PLAYER_COLORS[u.p], mine=u.p===0;
  const sk=SPR_OF[u.k]||u.k, sp=SPRITES[sk], box=sp.box;
  const H=(u.k==="titan"?52:30), W=H*(box[0]+2)/(box[1]+2), bw=Math.max(16,W*0.72);
  const g=document.createElementNS(NS,"g");
  g.setAttribute("data-uid",u.id);
  g.innerHTML=`<g class="sc">
    <ellipse cx="1" cy="3" rx="${(W*0.42).toFixed(1)}" ry="${(W*0.16).toFixed(1)}" fill="#0E241D" opacity=".55"/>
    <ellipse cx="0" cy="3" rx="${(W*0.5).toFixed(1)}" ry="${(W*0.2).toFixed(1)}" fill="${c}" opacity="${mine?.3:.22}"/>
    <g class="fl"><image x="${(-W/2).toFixed(1)}" y="${(-H+4).toFixed(1)}" width="${W.toFixed(1)}" height="${H}"/></g>
    <rect class="hf" x="${(-W/2).toFixed(1)}" y="${(-H+4).toFixed(1)}" width="${W.toFixed(1)}" height="${H}"
      fill="#FFFFFF" opacity="0" style="display:none"/></g>`;
  const ui=document.createElementNS(NS,"g");
  ui.innerHTML=`<circle class="cb" cy="-2" r="${(W*0.62).toFixed(1)}" fill="none" stroke="#F2555A" stroke-width="1.6" opacity=".8" style="display:none"/>
    <circle class="se" cy="-2" r="${(W*0.72).toFixed(1)}" fill="none" stroke="#F2F7EE" stroke-width="1.8" stroke-dasharray="4 4" style="display:none"/>
    <circle class="mn" cy="0" fill="none" stroke="${ch.hex}" stroke-width="1.6" style="display:none"/>
    <rect x="${(-bw/2).toFixed(1)}" y="${(-H-1).toFixed(1)}" width="${bw.toFixed(1)}" height="2.6" rx="1.3" fill="rgba(6,14,9,.85)"/>
    <rect class="hp" x="${(-bw/2).toFixed(1)}" y="${(-H-1).toFixed(1)}" width="${bw.toFixed(1)}" height="2.6" rx="1.3" fill="${c}"/>
    <circle cx="${(bw/2+3.5).toFixed(1)}" cy="${(-H+0.3).toFixed(1)}" r="2.6" fill="${ch.hex}" stroke="#0A0F0A" stroke-width=".8"/>
    ${mine?`<g class="plg" style="display:none"><rect class="mbg" x="-19" y="${(-H-15).toFixed(1)}" width="38" height="13" rx="6.5"/>
      <text class="plbig" y="${(-H-5.5).toFixed(1)}"></text></g>
      <text class="plmark" y="${(-H-5).toFixed(1)}"></text>`:""}`;
  const n={g,ui,sc:g.querySelector(".sc"),fl:g.querySelector(".fl"),img:g.querySelector("image"),hf:g.querySelector(".hf"),
    cb:ui.querySelector(".cb"),se:ui.querySelector(".se"),mn:ui.querySelector(".mn"),
    hp:ui.querySelector(".hp"),mark:ui.querySelector(".plmark"),
    plg:ui.querySelector(".plg"),mbg:ui.querySelector(".mbg"),plb:ui.querySelector(".plbig"),
    W,H,bw,band:-1,href:"",face:0,seen:0,k:0};
  const rr=ui.querySelectorAll("rect"); n.hpbg=rr[0];
  n.dot=ui.querySelectorAll("circle")[3]||null;
  UNODES.set(u.id,n);
  document.getElementById("unitLayer").appendChild(ui);
  return n;
}
let uframe=0;
function drawUnits(){
  if(!BANDS.el.length) return;
  const fr=Math.floor(performance.now()/150)%4;
  uframe++;
  S.units.forEach(u=>{
    if(!u.alive) return;
    const n=UNODES.get(u.id)||makeNode(u);
    n.seen=uframe;
    const ch=COINS[u.coin];
    const hit=u.hitT>0?u.hitT/0.2:0;
    const sx=hit?(Math.random()-0.5)*4.5:0, sy=hit?(Math.random()-0.5)*3:0;
    const T=`translate(${(u.x+sx).toFixed(1)},${(u.y+sy).toFixed(1)})`;
    n.g.setAttribute("transform",T); n.ui.setAttribute("transform",T);
    // 走路動畫
    const sk=SPR_OF[u.k]||u.k;
    const moving=(u.combatT>0||u.mineFx>0||u.moved>0.4);
    const href=SPRITES[sk][PCOL[u.p]][moving?fr:0];
    if(href!==n.href){n.href=href;n.img.setAttribute("href",href);}
    const face=u.face||1;
    if(face!==n.face){n.face=face;n.fl.setAttribute("transform",`scale(${face},1)`);}
    // 幣價越高，貓越大隻（腳底對齊地面）
    const k=+sizeMul(u).toFixed(2);
    if(k!==n.k){
      n.k=k;
      n.sc.setAttribute("transform",`translate(0,4) scale(${k}) translate(0,-4)`);
      const top=-(n.H*k)+4-5;
      n.hpbg.setAttribute("y",top.toFixed(1)); n.hp.setAttribute("y",top.toFixed(1));
      if(n.dot) n.dot.setAttribute("cy",(top+1.3).toFixed(1));
      if(n.mark) n.mark.setAttribute("y",(top-4).toFixed(1));
      if(n.plg){ n.plg.querySelector("rect").setAttribute("y",(top-14).toFixed(1));
                 n.plb.setAttribute("y",(top-4.5).toFixed(1)); }
      n.cb.setAttribute("r",(n.W*0.62*Math.max(1,k)).toFixed(1));
      n.se.setAttribute("r",(n.W*0.72*Math.max(1,k)).toFixed(1));
    }
    // 受擊閃白
    if(hit>0){n.hf.style.display="";n.hf.setAttribute("opacity",(hit*0.45).toFixed(2));}
    else if(n.hf.style.display!=="none") n.hf.style.display="none";
    // 交戰 / 選取 / 挖礦
    n.cb.style.display=u.combatT>0?"":"none";
    n.se.style.display=(S.selU===u.id)?"":"none";
    if(u.mineFx>0){n.mn.style.display="";n.mn.setAttribute("r",(n.W*0.5+(0.55-u.mineFx)*16).toFixed(1));
      n.mn.setAttribute("opacity",(u.mineFx/0.55*0.7).toFixed(2));}
    else if(n.mn.style.display!=="none") n.mn.style.display="none";
    n.hp.setAttribute("width",(n.bw*Math.max(0,u.hp/u.hpMax)).toFixed(1));
    if(n.mark){
      const r=ch.price<=0.002?0:ch.price/u.entry, up=r>=1, pct=Math.round((r-1)*100);
      const big=Math.abs(pct)>=12||r===0;                 // 漲跌夠大就跳出提示牌
      const t=r===0?"0":(up?"▲":"▼")+Math.abs(pct);
      if(n.mark.textContent!==t){n.mark.textContent=t;
        n.mark.setAttribute("fill",r===0?"#F2555A":(up?"#A3E635":"#F2555A"));}
      if(big!==n.big){
        n.big=big;
        n.plg.style.display=big?"":"none";
        n.mark.style.display=big?"none":"";
      }
      if(big){
        const txt=(r===0?"歸零":(pct>0?"+":"")+pct+"%");
        if(n.plb.textContent!==txt){
          n.plb.textContent=txt;
          n.mbg.setAttribute("fill",pct>0?"#A3E635":"#F2555A");
          n.plb.setAttribute("fill",pct>0?"#0B1004":"#FFF2F2");
          n.plg.setAttribute("class","plg "+(pct>0?"good":"bad"));
        }
      }
    }
    // 依 y 換到對應的場景帶（決定被前景擋住與否）
    const b=bandOf(u.y);
    if(b!==n.band){n.band=b;BANDS.el[b].appendChild(n.g);}
  });
  UNODES.forEach((n,id)=>{
    if(n.seen===uframe) return;
    n.g.remove(); n.ui.remove(); UNODES.delete(id);
  });
}

/* ============================ 畫面：我的部隊 ============================ */
function unitStatus(u){
  if(u.combatT>0) return ["交戰中","#F2555A"];
  const zi=ZINFO[ZONES[u.z][2]];
  if(!atZone(u)) return ["移動中 → "+zi.t,"#8A9583"];
  if(UNITS[u.k].role==="mine"&&zi.coin){
    const r=mineRate(u);
    return ["挖礦 +$"+r.toFixed(1)+"/s"+(r<zi.yield*0.8?"（遞減）":""),"#A3E635"];
  }
  return ["駐守 "+zi.t,"#8A9583"];
}
function updateHelper(){                         // 沒錢又沒兵的時候，告訴玩家接下來會發生什麼
  const el=$("#helper"), p=S.players[0]; if(!el||!p) return;
  const mine=S.units.filter(u=>u.alive&&u.p===0).length;
  const list=ROSTER.filter(k=>k!=="titan"&&COINS[UNITS[k].coin].price>0.002)
                   .map(k=>({k,c:costOf(k,p)})).sort((a,b)=>a.c-b.c);
  const cheap=list[0];
  S.broke=false;
  if(!p.alive||mine>0||!cheap||p.cash>=cheap.c){ if(el.className!=="helper") el.className="helper"; return; }
  S.broke=true;
  const inc=BASE_INCOME*catchUpMul(p)*(CLASSES[p.cls].incMul||1);
  const need=cheap.c-p.cash, secs=Math.max(1,Math.ceil(need/Math.max(0.1,inc)));
  const relief=Math.max(0,Math.ceil(p.reliefT==null?4:p.reliefT));
  el.className="helper on";
  el.innerHTML=`<b>沒錢，場上也沒有貓？別擔心，你不會就這樣輸掉。</b><br>
    基地每秒自動進 <b style="color:var(--lime)">$${inc.toFixed(1)}</b>　·　
    再 <b style="color:var(--mid)">${secs} 秒</b>就買得起 <b>${UNITS[cheap.k].n}×${PACK}（$${cheap.c}）</b>　·　
    <span style="color:var(--faint)">${relief} 秒後系統還會免費配一批礦工給你</span>
    <div class="hb"><i style="width:${Math.max(4,Math.min(100,p.cash/cheap.c*100)).toFixed(0)}%"></i></div>`;
}
function groupTroops(mine){                       // 同兵種＋同幣種合併成一組
  const g=new Map();
  mine.forEach(u=>{
    const key=u.k+"|"+u.coin;
    let o=g.get(key);
    if(!o){o={k:u.k,coin:u.coin,units:[],val:0,ret:0,pl:0,hp:0,fight:0,mining:0,moving:0};g.set(key,o);}
    o.units.push(u); o.val+=posValue(u); o.ret+=settleValue(u); o.hp+=u.hp/u.hpMax;
    const c=COINS[u.coin];
    o.pl+=(c.price<=0.002?-1:c.price/u.entry-1);
    if(u.combatT>0) o.fight++;
    else if(UNITS[u.k].role==="mine"&&ZINFO[ZONES[u.z][2]].coin&&atZone(u)) o.mining++;
    else if(!atZone(u)) o.moving++;
  });
  return [...g.values()].map(o=>{
    const n=o.units.length;
    o.n=n; o.pl=o.pl/n*100; o.hp=o.hp/n;
    o.sel=o.units.some(u=>u.id===S.selU);
    return o;
  }).sort((a,b)=>ROSTER.indexOf(a.k)-ROSTER.indexOf(b.k));
}
function renderTroops(){
  const list=$("#tlist"); if(!list) return;
  const mine=S.units.filter(u=>u.alive&&u.p===0);
  const gs=groupTroops(mine);
  renderStrip(gs);
  $("#tcount").textContent=mine.length?mine.length+" 隻 · "+money(posTotal(S.players[0])):"0 隻";
  if(!gs.length){
    list.innerHTML=`<div class="tempty">場上沒有部隊。<br>從下方角色卡召喚（＝買入對應的幣）。</div>`;
    return;
  }
  list.innerHTML=gs.map(o=>{
    const ch=COINS[o.coin], hot=o.pl>=12;
    const st=o.fight?[`交戰中 ${o.fight}/${o.n}`,"#F2555A"]
      :o.mining?[`挖礦中 ${o.mining}/${o.n}`,"#A3E635"]
      :o.moving?[`移動中 ${o.moving}/${o.n}`,"#8A9583"]:["駐守中","#8A9583"];

/* ============================ 操作：召喚＝買入 ============================ */
function summon(k){
  if(k==="titan") return allIn("titan");
  const p=S.players[0], u=UNITS[k], cost=costOf(k,p);
  if(!p.alive||(p.cd[k]||0)>0||p.cash<cost) return;
  if(COINS[u.coin].price<=0.002){
    toast(`⚠ <b>${u.coin}</b> 已經歸零，買不回來了 — ${COIN_UNITS[u.coin]} 這局不能再召喚`,"bad");
    return;
  }
  const drop=(k==="para");
  if(drop&&S.sel==null){log("傘兵需要先在地圖上選一個空降點","bad");return;}
  const target=S.sel!=null?S.sel:defaultTarget(0,k);
  p.cash-=cost;
  S.stats.buys++; S.stats.invested+=cost; S.stats.spend[u.coin]+=cost;
  p.cd[k]=u.cd*cdMulOf(p);
  const each=cost/packOf(k);
  for(let i=0;i<packOf(k);i++) spawn(0,k,target,drop,{coin:u.coin,stake:each});
  priceImpact(u.coin,cost);
  flashUnit(k); sfx("buy",1);
  log(`召喚 <b>${u.n}×${packOf(k)}</b>：買入 ${money(cost)} 的 <b>${u.coin}</b> → ${ZINFO[ZONES[target][2]].t}`);
  refreshAll();
}
function allIn(k){
  const p=S.players[0], u=UNITS[k];
  if(p.allin||p.cash<ALLIN_MIN||!p.alive) return;
  if(COINS[u.coin].price<=0.002){
    toast(`⚠ <b>${u.coin}</b> 已經歸零，All-in 沒有意義`,"bad"); return;
  }
  const stake=p.cash, target=S.sel!=null?S.sel:defaultTarget(0,"soldier");
  S.stats.allin=stake;
  toast(`<b>ALL-IN</b>：${money(stake)} 全押 ${u.coin}，巨獸出場（每場一次）`,"warn",3600);
  p.cash=0; p.allin=true;
  spawn(0,"titan",target,false,{coin:u.coin,stake});
  priceImpact(u.coin,stake*1.6);
  log(`<b>ALL-IN</b>：${money(stake)} 全押 ${u.coin}，${u.coin} 巨獸出場（每場一次）`,"good");
  refreshAll();
}

/* ============================ 操作：結算＝賣出 ============================ */
function settle(u,quiet){
  if(!u||!u.alive) return 0;
  const p=S.players[u.p], got=settleValue(u);
  p.cash+=got; u.alive=false;
  if(u.p===0){fxKill(u.x,u.y,"#F2F7EE");sfx("sell",1);}
  priceImpact(u.coin,-posValue(u));
  if(u.p===0){
    const st=S.stats, pct=got/Math.max(1,u.stake)-1;
    st.sells++; st.realized+=got-u.stake; st.holdSum+=u.age; st.holdN++;
    const rec={k:u.k,coin:u.coin,entry:u.entry,exit:COINS[u.coin].price,pct,pl:got-u.stake};
    if(!st.best||pct>st.best.pct) st.best=rec;
    if(!st.worst||pct<st.worst.pct) st.worst=rec;
    if(u.k==="titan") st.allinPL=got-u.stake;
  }
  if(u.p===0&&!quiet){
    const pl=got-u.stake;
    log(`結算 <b>${UNITS[u.k].n}</b>：賣出 ${u.coin} 取回 ${money(got)}
      （${pl>=0?"+":"−"}${money(Math.abs(pl))}）`,pl>=0?"good":"bad");
  }
  if(S.selU===u.id) S.selU=null;
  return got;
}
function settleAll(){
  const mine=S.units.filter(u=>u.alive&&u.p===0);
  if(!mine.length) return;
  let got=0, cost=0;
  mine.forEach(u=>{cost+=u.stake;got+=settle(u,true);});
  const pl=got-cost;
  log(`全部結算：撤回 ${mine.length} 支部隊，取回 <b>${money(got)}</b>（${pl>=0?"+":"−"}${money(Math.abs(pl))}）`,
      pl>=0?"good":"bad");
  refreshAll();
}

function leaderIdx(){
  let best=-1,bw=-1;
  S.players.forEach(p=>{if(p.alive){const w=netWorth(p);if(w>bw){bw=w;best=p.i;}}});
  return best;
}
function defaultTarget(pi,k){
  const role=UNITS[k].role;
  if(role==="mine"){                                   // 優先挑人比較少的礦區
    const mines=ZONES.map((z,i)=>i).filter(i=>ZINFO[ZONES[i][2]].coin);
    mines.sort((a,b)=>minersIn(pi,a)-minersIn(pi,b));
    const few=mines.filter(i=>minersIn(pi,i)===minersIn(pi,mines[0]));
    return few[Math.floor(Math.random()*few.length)];
  }
  const lead=leaderIdx();
  let enemies=S.units.filter(u=>u.alive&&u.p!==pi&&u.p===lead);   // 先打第一名
  if(!enemies.length) enemies=S.units.filter(u=>u.alive&&u.p!==pi);
  if(enemies.length) return enemies[Math.floor(Math.random()*enemies.length)].z;
  return 4;
}
function spawn(pi,k,zi,drop,o){
  const src=drop?zi:ZONES.findIndex(z=>z[2]==="base"&&z[3]===pi);
  const {x,y}=hexXY(ZONES[src][0],ZONES[src][1]);
  const d=UNITS[k], coin=o.coin, price=COINS[coin].price, stake=o.stake;
  let hp=d.hp, atk=d.atk;
  if(k==="titan"){hp=Math.min(1800,260+stake*0.55);atk=Math.min(95,18+stake*0.035);}
  S.units.push({id:++S.uid,p:pi,k,coin,z:zi,alive:true,
    entry:price, qty:stake/price, stake, atk, age:0,
    hp, hpMax:hp, x:x+(Math.random()*34-17), y:y+(Math.random()*26-13),
    atkT:0, mineT:1, hitT:0, combatT:0, mineFx:0, moved:1, face:(pi===1||pi===2)?-1:1});
}

];
const TREND_T=9;                                   // 一段行情走幾秒
function tickPrices(dt){
  dt=dt||0.6;
  CK.forEach(k=>{
    const c=COINS[k];
    if(c.price<=0.002){c.hist.push(0);c.hist.shift();return;}
    let drift=(Math.random()-0.5)*c.vol*2;         // 平時只有很小的雜訊
    if(S.trend&&S.trend.c===k) drift+=S.trend.rate*dt;   // 新聞造成的趨勢
    c.price=Math.max(0.002,c.price*(1+drift));
    if(k==="MEOW"&&S.t<120&&Math.random()<0.0009){
      S.stats.rugged=true;
      S.units.forEach(u=>{if(u.alive&&u.p===0&&u.coin==="MEOW") S.stats.rugLoss+=posValue(u);});
      c.price=0.002;
      toast("⚠ <b>喵喵迷因幣被抽乾了</b>：MEOW 部隊只剩 50% 戰力，牠們身上的錢幾乎歸零，而且買不回來了。","bad",7000);
      log("<b>喵喵迷因幣歸零</b>：所有 MEOW 部隊虛弱化","bad");
    }
    c.hist.push(c.price); c.hist.shift();
  });
  updateHint();
}
function marketEvents(dt){
  if(S.trend){                                     // 行情進行中
    S.trend.t-=dt;
    if(S.trend.t<=0){S.trend=null;S.evtT=5+Math.random()*4;}
    return;
  }
  const lead=(S.cls&&CLASSES[S.cls].lead)||6;
  S.evtT-=dt;
  if(S.evtT<=lead&&S.evtT>0&&!S.warn&&S.pending){
    S.warn=1; sfx("warn",1);
  }
  if(S.evtT<=0){
    if(S.pending){
      const e=S.pending;
      S.trend={c:e.c, rate:(Math.pow(e.f,1/TREND_T)-1), t:TREND_T, t2:e.t.replace(/<\/?b>/g,"")};
      log(e.t,e.f>=1?"good":"bad");
      S.pending=null; S.warn=null;
    }else{
      S.pending=EVENTS[Math.floor(Math.random()*EVENTS.length)];
      S.evtT=7+Math.random()*5;
    }
  }
}

function updateHint(){
  const n=COINS.MEOW, h=n.hist, r=h[h.length-10]?n.price/h[h.length-10]:1;

/* ============================ 模擬 ============================ */
function step(dt){
  S.players.forEach(p=>{for(const k in p.cd) p.cd[k]=Math.max(0,p.cd[k]-dt);});
  marketEvents(dt);

  S.avgW=avgWorth();
  S.fx.forEach(f=>{f.t-=dt;});
  if(S.fx.length) S.fx=S.fx.filter(f=>f.t>0);

  // 基地保底收入（落後越多給越多）
  S.players.forEach(p=>{
    if(!p.alive) return;
    p.incT-=dt;
    if(p.incT>0) return;
    p.incT=1;
    const inc=BASE_INCOME*catchUpMul(p)*(CLASSES[p.cls].incMul||1);
    p.cash+=inc;
    // 破產保護：場上沒兵又買不起礦工時，每 10 秒配一名免費礦工
    if(!S.units.some(x=>x.alive&&x.p===p.i)&&p.cash<costOf("miner",p)){
      p.reliefT=(p.reliefT==null?4:p.reliefT)-1;
      if(p.reliefT<=0){
        p.reliefT=6;
        for(let i=0;i<PACK;i++)
          spawn(p.i,"miner",defaultTarget(p.i,"miner"),false,{coin:"CATN",stake:100/PACK});
        if(p.me) toast("🎁 破產保護：免費配給你 <b>礦工×3</b>（每 6 秒一次，直到你站起來）","warn");
      }
    }else p.reliefT=4;
    if(p.me){
      S.baseInc=inc;
      const b=ZONES.findIndex(z=>z[2]==="base"&&z[3]===0), {x,y}=hexXY(ZONES[b][0],ZONES[b][1]);
      fxCoin(x,y-6,"+$"+inc.toFixed(1),"#4FD1C5");
    }
  });

  S.units.forEach(u=>{
    if(!u.alive) return;
    u.age+=dt;
    if(u.hitT>0) u.hitT=Math.max(0,u.hitT-dt);
    if(u.mineFx>0) u.mineFx=Math.max(0,u.mineFx-dt);
    if(u.moved>0) u.moved=Math.max(0,u.moved-dt*1.2);
    if(u.combatT>0) u.combatT=Math.max(0,u.combatT-dt);
    const d=UNITS[u.k], z=ZONES[u.z], zi=ZINFO[z[2]];
    const {x,y}=hexXY(z[0],z[1]);
    const dx=x-u.x, dy=y-u.y, dist=Math.hypot(dx,dy);
    let tgt=null;
    if(d.role!=="mine"){
      let best=1e9;
      const lead=leaderIdx();
      S.units.forEach(o=>{
        if(!o.alive||o.p===u.p) return;
        const dd=Math.hypot(o.x-u.x,o.y-u.y);
        let pref=(d.role==="hunt"&&UNITS[o.k].role==="mine")?dd*0.6:dd;
        if(o.p===lead&&u.p!==lead) pref*=0.65;             // 大家先打第一名
        if(pref<best){best=pref;tgt=o;}
      });
    }
    if(tgt&&Math.hypot(tgt.x-u.x,tgt.y-u.y)<170){
      const tdx=tgt.x-u.x, tdy=tgt.y-u.y, td=Math.hypot(tdx,tdy);
      if(Math.abs(tdx)>1) u.face=tdx>0?1:-1;                 // 面向目標
      if(td>d.rng){u.x+=tdx/td*d.spd*dt;u.y+=tdy/td*d.spd*dt;u.moved=1;}
      else{
        u.atkT-=dt;
        if(u.atkT<=0){
          u.atkT=0.65;
          const dmg=(u.atk||d.atk)*powerMul(u);
          tgt.hp-=dmg;
          const near=(u.p===0||tgt.p===0);
          u.combatT=1.4; tgt.combatT=1.4; tgt.hitT=0.2;
          fxShot(u,tgt,PLAYER_COLORS[u.p]);
          fxHit(tgt.x,tgt.y,PLAYER_COLORS[u.p]);
          if(near){ fxDmg(tgt.x,tgt.y,dmg,tgt.p===0); sfx("shot",0.8); }
          if(tgt.hp<=0){
            tgt.alive=false;
            fxKill(tgt.x,tgt.y,PLAYER_COLORS[tgt.p]);
            const loot=posValue(tgt)*0.15;                 // 掠奪：搶走對方部位的 15%
            S.players[u.p].cash+=loot;
            const back=posValue(tgt)*DEATH_BACK;           // 陣亡賠償：自己拿回三成殘值
            S.players[tgt.p].cash+=back;
            if(tgt.p===0){ fxCoin(tgt.x,tgt.y-4,"+$"+back.toFixed(0)+" 賠償","#4FD1C5"); sfx("coin",0.5); }
            if(near) sfx("kill",1);
            if(u.p===0){ fxCoin(tgt.x,tgt.y-6,"掠奪 +$"+loot.toFixed(0),"#F5A524"); sfx("coin",0.8); }
            if(tgt.id===S.selU) S.selU=null;
            if(tgt.p===0){S.stats.deaths++;S.stats.deathLoss+=Math.max(0,tgt.stake-back);
              if(tgt.k==="titan") S.stats.allinPL=back-tgt.stake;}
            if(tgt.p===0) log(`你的 <b>${UNITS[tgt.k].n}</b> 陣亡 — 賠償 ${money(back)}，其餘 ${money(Math.max(0,tgt.stake-back))} 蒸發`,"bad");
            else if(u.p===0) log(`${UNITS[u.k].n} 擊殺 <b>${S.players[tgt.p].name}</b> 的 ${UNITS[tgt.k].n}`,"good");
          }
        }
      }
    }else if(dist>18){
      if(Math.abs(dx)>1) u.face=dx>0?1:-1;                    // 面向行進方向
      u.x+=dx/dist*d.spd*dt; u.y+=dy/dist*d.spd*dt; u.moved=1;
    }else if(d.role==="mine"&&zi.coin){
      u.mineT-=dt;
      if(u.mineT<=0){
        u.mineT=1;
        const p=S.players[u.p];
        const usd=mineRate(u);
        const hold=(p.auto!=="sell"&&COINS[u.coin].price>0.002);
        if(hold) u.qty+=usd/COINS[u.coin].price; else p.cash+=usd;
        u.mineFx=0.55;
        if(p.me){
          const c=COINS[u.coin];
          fxCoin(u.x,u.y,hold?"+"+(usd/c.price).toFixed(2)+" "+u.coin:"+$"+usd.toFixed(1),
                 hold?c.hex:"#A3E635");
          sfx("coin",0.55);
        }
      }
    }
  });
  S.units=S.units.filter(u=>u.alive);

  /* ---- AI：也玩同一套循環 ---- */
  S.players.forEach(p=>{
    if(p.me||!p.alive) return;
    p.aiNext-=dt;
    if(p.aiNext>0) return;
    p.aiNext=1.8+Math.random()*2.2;
    // 有賺就結算，快死也結算
    S.units.forEach(u=>{
      if(!u.alive||u.p!==p.i) return;
      const r=COINS[u.coin].price/u.entry;
      if(r>1.12||u.hp/u.hpMax<0.35||(S.t<12&&r>0.98)) settle(u,true);
    });
    const pool=ROSTER.filter(k=>k!=="titan"&&costOf(k,p)<=p.cash&&COINS[UNITS[k].coin].price>0.002&&!(p.cd[k]>0));
    if(pool.length){
      // 幣價漲的兵種比較常被 AI 選
      const wts=pool.map(k=>{const c=COINS[UNITS[k].coin];return Math.max(0.2,c.price/c.ref);});
      let s=wts.reduce((a,b)=>a+b,0)*Math.random(), pick=pool[0];
      for(let i=0;i<pool.length;i++){s-=wts[i];if(s<=0){pick=pool[i];break;}}
      const cost=costOf(pick,p), tz=defaultTarget(p.i,pick);
      p.cash-=cost; p.cd[pick]=UNITS[pick].cd*cdMulOf(p);
      for(let i=0;i<packOf(pick);i++)
        spawn(p.i,pick,tz,false,{coin:UNITS[pick].coin,stake:cost/packOf(pick)});
      priceImpact(UNITS[pick].coin,cost*0.6);
    }
    if(!p.allin&&S.t<45&&p.cash>1200&&Math.random()<0.35){
      const k=Math.random()<0.6?"soldier":"guard";
      p.allin=true; const stake=p.cash; p.cash=0;
      spawn(p.i,"titan",defaultTarget(p.i,k),false,{coin:UNITS[k].coin,stake});
      log(`<b>${p.name}</b> All-in 了`,"bad");
    }
  });

  S.players.forEach(p=>{
    if(p.alive&&netWorth(p)<40){
      p.alive=false;
      S.units.forEach(u=>{if(u.p===p.i)u.alive=false;});
      log(`<b>${p.name}</b> 資產歸零，出局`,p.me?"bad":"good");
    }
  });
}

/* ============================ 迴圈 ============================ */
let last=0, priceAcc=0, uiAcc=0, troopAcc=0;
function loop(ts){
  if(!S.running) return;
  if(!last) last=ts;
  const dt=Math.min(0.05,(ts-last)/1000); last=ts;
  S.t-=dt; priceAcc+=dt; uiAcc+=dt;
  if(priceAcc>=0.35){tickPrices(priceAcc);priceAcc=0;renderCoins();}
  step(dt); drawUnits(); drawFx();
  if(uiAcc>=0.2){uiAcc=0;renderPlayers();updateUnits();updateClock();updateTarget();
    drawZoneFx();renderEvtBar();updateHelper();
    troopAcc++; if(troopAcc>=2){troopAcc=0;renderTroops();}}
  if(S.t<=0||S.players.filter(p=>p.alive).length<=1) return finish();
  requestAnimationFrame(loop);
}
function updateClock(){
  const t=Math.max(0,S.t), m=Math.floor(t/60), s=Math.floor(t%60);
  const txt=`${m}:${String(s).padStart(2,"0")}`;
  $("#timer").textContent=txt;
  const mt=$("#mtimer"); if(mt){mt.textContent=txt;mt.classList.toggle("warn",t<=30);}
  $("#clock").classList.toggle("warn",t<=30);
}
function refreshAll(){renderPlayers();renderCoins();updateUnits();updateTarget();renderTroops();}
function lessons(){
  const st=S.stats, me=S.players[0], out=[];
  const open=posTotal(me), total=netWorth(me);
  const pctOf=(v)=>Math.round(v/Math.max(1,st.invested)*100);
  if(st.best&&st.best.pct>0.02){
    const b=st.best;
    out.push(["成本基準 · Cost Basis","買在多少，決定你賺多少",
      `你有一隻 ${UNITS[b.k].n} 在 ${b.coin} $${b.entry.toFixed(2)} 時召喚、$${b.exit.toFixed(2)} 時結算，
       多賺了 ${Math.round(b.pct*100)}%（${money(b.pl)}）。<b>賺賠看的是買進價和賣出價的差</b>，
       不是幣「貴不貴」——這就是所謂的成本基準。`]);
  }
  if(open>total*0.25){
    out.push(["未實現損益 · Unrealized P&L","帳面上的錢，不是你的錢",
      `時間到的時候你還有 ${money(open)} 卡在場上的部隊身上。這叫<b>未實現損益</b>：
       看得到、算進總資產，但只要沒賣掉，它隨時會變。真的落袋要按結算。`]);
  }
  if(st.deaths>0){
    out.push(["風險資本 · Risk Capital","投資會賠，而且賠掉的拿不回來",
      `你有 ${st.deaths} 支部隊陣亡，賠償只拿回三成，淨損 ${money(st.deathLoss)}，佔你總投入的 ${pctOf(st.deathLoss)}%。
       <b>丟進去的錢是有風險的</b>，不是放在銀行的存款。`]);
  }
  if(st.rugged){
    out.push(["抽地毯 · Rug Pull","項目方跑了，幣一秒變壁紙",
      `喵喵迷因幣這局被抽乾流動性、直接歸零${st.rugLoss>1?`，你手上 ${money(st.rugLoss)} 的部位跟著蒸發`:""}。
       現實裡也有：<b>項目方把資金池抽走，幣一秒變壁紙</b>，而且再也買不回來。`]);
  }
  const sp=st.spend, tot=sp.NOX+sp.CATN+sp.MEOW;
  if(tot>200){
    const top=Object.keys(sp).sort((a,b)=>sp[b]-sp[a])[0], share=Math.round(sp[top]/tot*100);
    if(share>=60) out.push(["集中風險 · Concentration Risk","你把雞蛋放在同一個籃子",
      `這局有 ${share}% 的錢押在 <b>${top}</b> 上。集中持有會把賺跟賠一起放大；
       分散到不同幣，整體起伏會小很多。`]);
    else out.push(["分散投資 · Diversification","你有做到分散",
      `你的錢分散在不同幣種（最高只佔 ${share}%），所以單一幣崩盤時不會整組陣亡——
       這就是<b>分散投資</b>在做的事。`]);
  }
  if(st.holdN>=2){
    const avg=st.holdSum/st.holdN;
    if(avg<14) out.push(["手續費侵蝕 · Fee Drag","你是短線玩家",
      `你平均只抱 ${avg.toFixed(0)} 秒就結算。頻繁進出能鎖住小獲利，
       但<b>每次買賣都要付手續費</b>，次數一多就會吃掉利潤。`]);
    else if(avg>45) out.push(["長期持有 · HODL","你是長抱玩家",
      `你平均抱了 ${avg.toFixed(0)} 秒。抱久了能吃到整段趨勢，
       但也要<b>忍受中間的上下震盪</b>，而且錢卡著就不能拿去做別的事。`]);
  }
  if(st.allin>0&&st.allinPL!=null){
    out.push(["部位大小 · Position Sizing","重倉的代價",
      `你 All-in 了 ${money(st.allin)}，最後${st.allinPL>=0?`多賺 ${money(st.allinPL)}`:`賠掉 ${money(-st.allinPL)}`}。
       <b>把全部資金押在一次判斷上</b>，賺的時候很爽，錯一次就沒有下一局了。`]);
  }
  if(!out.length) out.push(["買低賣高 · Buy Low, Sell High","這局你幾乎沒有進出",
    "召喚就是買、結算就是賣。下一局試著在幣價漲的時候按結算，把獲利換回 Cash。"]);
  return out.slice(0,4);
}
function finish(){
  S.running=false; S.over=true;
  const rank=[...S.players].sort((a,b)=>(b.alive-a.alive)||(netWorth(b)-netWorth(a)));
  const win=rank[0], meWin=win.me;
  $("#resTag").textContent=meWin?"VICTORY":"DEFEAT";
  $("#resTitle").textContent=meWin?"你活下來，而且錢最多":"你不是場上最有錢的";
  $("#resLead").textContent=`三分鐘結束，${win.name} 以 ${money(netWorth(win))} 的資產獲勝。未結算的部隊按當下幣價計入。`;
  $("#resList").innerHTML=rank.map((p,i)=>
    `<div class="rrow ${i===0?"win":""}"><span><i class="dot" style="background:${p.color};display:inline-block;margin-right:8px"></i>${i+1}. ${p.name}${p.alive?"":"（出局）"}</span>
     <span class="v" style="color:${p.color}">${money(netWorth(p))}</span></div>`).join("");
  const me=S.players[0], st=S.stats, chg=netWorth(me)/me.start-1;
  $("#resSum").innerHTML=`你從 ${money(me.start)} 走到 <b style="color:${chg>=0?"var(--up)":"var(--down)"}">${money(netWorth(me))}</b>
    （${chg>=0?"+":"−"}${Math.abs(chg*100).toFixed(0)}%）· 買入 ${st.buys} 次 · 結算 ${st.sells} 次 ·
    已實現損益 <b style="color:${st.realized>=0?"var(--up)":"var(--down)"}">${st.realized>=0?"+":"−"}${money(Math.abs(st.realized))}</b>`;
  $("#lessons").innerHTML=lessons().map(([term,t,d])=>
    `<div class="lsn"><i class="term">${term}</i><b>${t}</b><p>${d}</p></div>`).join("");
  $("#resultOv").classList.remove("hide");
}

/* ============================ 開場 ============================ */
$("#classes").innerHTML=Object.entries(CLASSES).map(([k,c])=>`
  <button class="cls" data-c="${k}">
    <div class="cg">${c.g}</div><h4>${c.n}</h4><p>${c.d}</p>
    <div class="roster">${c.tags.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="stat"><span>開局 $${c.cash.toLocaleString()}</span><span>幣價影響 ${Math.round(c.lo*100)}–${Math.round(c.hi*100)}%</span></div>
  </button>`).join("");
$("#classes").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>start(b.dataset.c));

function start(clsKey){
  if(document.fonts&&document.fonts.load){
    document.fonts.load('900 12px "Noto Sans TC"'); document.fonts.load('400 8px "Press Start 2P"');
  }
  CK.forEach(k=>{COINS[k].ref=COINS[k].price;COINS[k].hist=Array.from({length:40},()=>COINS[k].price);});
  S.cls=clsKey; initPlayers(clsKey);
  $("#selectOv").classList.add("hide");
  renderMap(); renderUnits(); setupCamera();
  Object.assign(CAM,homeView()); clampCam(); applyCam();

  // 點自己的部隊 → 選取（可結算）
  document.getElementById("scene").addEventListener("pointerdown",e=>{
    const g=e.target.closest("[data-uid]"); if(!g) return;
    const u=S.units.find(x=>x.id===+g.dataset.uid&&x.alive);
    if(!u||u.p!==0) return;
    e.stopPropagation();
    S.selU=(S.selU===u.id)?null:u.id;
    updateTarget(); updateUnits(); renderTroops();
  });
  const pickTroop=(e)=>{
    const row=e.target.closest("[data-tid]"); if(!row) return;
    const u=S.units.find(x=>x.id===+row.dataset.tid&&x.alive); if(!u) return;
    S.selU=u.id;
    animateTo({x:u.x,y:u.y-10,z:Math.max(CAM.z,1.6)},320);
    updateTarget(); updateUnits(); renderTroops();
  };
  $("#tstrip").addEventListener("click",pickTroop);
  $("#tlist").addEventListener("click",e=>{
    const set=e.target.closest("[data-settle]");
    if(set){
      const [k,coin]=set.dataset.settle.split("|");
      const grp=S.units.filter(u=>u.alive&&u.p===0&&u.k===k&&u.coin===coin);
      if(grp.length){
        let got=0,cost=0;
        grp.forEach(u=>{cost+=u.stake;got+=settle(u,true);});
        const pl=got-cost;
        log(`結算 <b>${UNITS[k].n}×${grp.length}</b>：取回 ${money(got)}（${pl>=0?"+":"−"}${money(Math.abs(pl))}）`,
            pl>=0?"good":"bad");
        sfx("sell",1); refreshAll();
      }
      return;
    }
    const row=e.target.closest("[data-tid]"); if(!row) return;
    const u=S.units.find(x=>x.id===+row.dataset.tid&&x.alive); if(!u) return;
    S.selU=u.id;
    animateTo({x:u.x,y:u.y-10,z:Math.max(CAM.z,1.6)},320);
    updateTarget(); updateUnits(); renderTroops();
  });
  $("#zsfx").onclick=()=>{
    sfxInit();
    SFX.on=!SFX.on;
    $("#zsfx").textContent=SFX.on?"🔊":"🔇";
    $("#zsfx").classList.toggle("on",SFX.on);
    if(SFX.on) sfx("buy",1);
  };
  $("#settleOne").onclick=()=>{const u=S.units.find(x=>x.id===S.selU&&x.alive);if(u){settle(u);refreshAll();}};
  $("#settleAll").onclick=settleAll;
  $("#autoBtn").onclick=()=>{
    const p=S.players[0]; p.auto=p.auto==="sell"?"hold":"sell";
    log(p.auto==="sell"?"礦工產出改為 <b>自動賣出</b>（穩定收 Cash）":"礦工產出改為 <b>自動持有</b>（併進那隻貓身上，跟著漲跌）");
    updateUnits();
  };
  const intro=$("#intro"); intro.classList.add("on");
  setTimeout(()=>intro.classList.remove("on"),2600);
  $("#mecolor").textContent="YOU = P1"; $("#mecolor").style.color=PLAYER_COLORS[0];
  refreshAll(); updateClock();
  log(`開局：${CLASSES[clsKey].n}`,"good");
  toast("先按左邊第一隻 <b>礦工</b>，派牠去礦區賺 Cash。","warn",5200);
  S.running=true; last=0; requestAnimationFrame(loop);
}
addEventListener("keydown",e=>{
  if(!S.running) return;
  const i=parseInt(e.key,10);
  if(i>=1&&i<=ROSTER.length){summon(ROSTER[i-1]);return;}
  const k=e.key.toLowerCase();
  if(k==="q"){const u=S.units.find(x=>x.id===S.selU&&x.alive);if(u){settle(u);refreshAll();}}
  if(k==="e") settleAll();
  if(k==="a") $("#autoBtn").click();
});
})();
</script>
